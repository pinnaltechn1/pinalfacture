<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pinal_Facture — Logiciel SaaS de facturation pour l'Afrique</title>
  <meta name="description" content="Pinal_Facture permet aux entrepreneurs, freelances et PME africaines de créer des factures professionnelles en FCFA, gérer leurs clients et suivre les paiements Wave et Orange Money.">
  <meta name="theme-color" content="#0F766E">
  
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- App Stylesheet -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex flex-col min-h-screen">
  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Global Modal Container -->
  <div id="modal-container" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>

  <!-- App Root -->
  <div id="app" class="flex-1 flex flex-col min-h-screen">
    <!-- Content dynamically rendered by router -->
    <div id="main-content" class="flex-1 flex flex-col"></div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
